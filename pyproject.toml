[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dema"
version = "0.1.0"
description = "Meta-labeling filter for an EMA 9/21 crossover on 1h OHLCV"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tuning = ["optuna>=3.5"]
diagnostics = ["shap>=0.44", "matplotlib>=3.8", "statsmodels>=0.14"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning"]
