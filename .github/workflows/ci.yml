name: CI

on:
  push:
  pull_request:

jobs:
  leakage-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests (includes the leakage gate and its negative controls)
        run: pytest tests/ -q
      - name: G1 gate — leakage must be green before any training
        run: python -m dema.cli audit --smoke-test --out artifacts/ci
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-audit
          path: artifacts/ci
